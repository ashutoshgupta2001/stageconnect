services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: stageconnect
      POSTGRES_PASSWORD: stageconnect_dev
      POSTGRES_DB: stageconnect
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stageconnect -d stageconnect"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:

