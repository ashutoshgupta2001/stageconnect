name: StageConnect checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: stageconnect
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: stageconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stageconnect -d stageconnect_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://stageconnect:integration_only@127.0.0.1:5432/stageconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
